# Postgres docker-compose from https://github.com/felipewom/docker-compose-postgres

services:
  database:
    image: 'postgres:16'
    ports:
      - 127.0.0.1:15432:5432
    env_file:
      - .env
    networks:
      - api-network
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/DockerFile
    ports:
      - "8000:8000"
    depends_on:
      - database
    env_file:
      - .env
    environment:
      # Overrides for docker from dev values in .env
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
    networks:
      - api-network
    restart: unless-stopped

networks:
  api-network:
    driver: bridge

volumes:
  postgres_data:
